<!doctype html>
<html lang="ru">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>World of Chihuahua — прототип 4</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1b1730;overscroll-behavior:none}
body{font-family:ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace;color:#fff;user-select:none;-webkit-user-select:none}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:#2b2545;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px}
header .t{font-size:12px;font-weight:700;color:#ffd23f}
header .s{font-size:12px;color:#d6d0f5;margin-top:3px}
.chip{background:#1b1730;border:2px solid #5a5190;padding:6px 6px;font-size:12px;font-weight:700;white-space:nowrap}
#zones{display:grid;grid-template-columns:repeat(4,1fr);background:#1b1730;border-top:3px solid #1b1730;border-bottom:3px solid #1b1730;gap:2px}
#zones button{height:44px;background:#2b2545;border:0;color:#d6d0f5;font:inherit;font-size:11px;line-height:1.3;cursor:pointer}
#zones button.on{background:#ffd23f;color:#2b2545;font-weight:700}
#zones button.lock{color:#8f88b8}
#yard{position:relative;flex:1;overflow:hidden;touch-action:none}
.px{image-rendering:pixelated;image-rendering:crisp-edges}
#scn{position:absolute;inset:0}
#pen{position:absolute;left:0;right:0;bottom:0;height:96px;background:rgba(40,25,10,.22);border-top:6px dashed #7a4a2a}
#pen span{position:absolute;left:6px;top:-22px;background:#1b1730;font-size:10px;padding:2px 5px}
#lakeBtn{position:absolute;right:calc(44% - 30px);top:26px;background:none;border:0;padding:0;color:#fff;font:inherit;cursor:pointer;text-align:center}
#lakeBtn span{display:block;background:#1b1730;font-size:11px;padding:2px 5px;margin-top:-2px}
.dog{position:absolute;left:0;top:0;width:72px;height:72px;touch-action:none;cursor:grab}
.dog .sh{position:absolute;left:14px;top:66px;width:44px;height:7px;background:rgba(0,0,0,.22)}
.dog .spr{position:absolute;inset:0;transition:transform .12s}
.dog img{width:72px;height:72px;pointer-events:none;display:block}
.dog.lift{z-index:9999!important}
.dog.lift .spr{transform:translateY(-12px) scale(1.15)}
.dog.cand{outline:2px dashed rgba(255,255,255,.6)}
.dog.target{outline:4px dashed #ffd23f}
.dog .rar{position:absolute;right:4px;bottom:0;width:10px;height:10px;border:2px solid #1b1730}
.dog .coin{position:absolute;left:22px;top:-22px;min-width:26px;height:22px;padding:0 4px;background:#ffd23f;color:#2b2545;border:2px solid #1b1730;font-size:12px;font-weight:700;line-height:18px;text-align:center;display:none;animation:bob 1s infinite alternate}
.dog .zz{position:absolute;left:50px;top:-8px;background:#fff;color:#2b2545;border:2px solid #1b1730;font-size:10px;font-weight:700;padding:0 3px;display:none}
@keyframes bob{to{transform:translateY(-4px)}}
.fl{position:absolute;color:#fff;font-weight:700;font-size:14px;text-shadow:2px 2px 0 #1b1730;pointer-events:none;animation:up .9s forwards;z-index:10000}
@keyframes up{to{transform:translateY(-36px);opacity:0}}
#bar{display:flex;gap:8px;align-items:center;padding:8px 10px;border-top:3px solid #1b1730}
#bar .c{font-size:11px;color:#d6d0f5;line-height:1.3;min-width:56px}
#bar .c b{color:#fff;font-size:14px}
button.main{flex:1;min-height:46px;background:#ffd23f;color:#2b2545;border:3px solid #1b1730;font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:4px 6px}
button.ghost{flex:1;min-height:46px;padding:4px 8px;background:#3d3668;color:#fff;border:3px solid #1b1730;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
nav{display:grid;grid-template-columns:repeat(6,1fr);background:#1b1730}
nav button{height:54px;background:none;border:0;color:#d6d0f5;font:inherit;font-size:11px;cursor:pointer;padding:0}
nav button.on{background:#3d3668;color:#fff;font-weight:700}
.panel{position:absolute;left:0;right:0;top:0;bottom:54px;background:#2b2545;overflow-y:auto;padding:14px;display:none;z-index:20000}
.panel.on{display:block}
.panel h2{margin:0 0 4px;font-size:18px}
.panel p{margin:0 0 12px;font-size:13px;color:#d6d0f5;line-height:1.4}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{background:#1b1730;border:3px solid #5a5190;padding:4px;text-align:center;font:inherit;font-size:10px;color:#d6d0f5;cursor:pointer}
.card img{width:100%;display:block}
.row{display:flex;align-items:center;gap:10px;width:100%;background:#1b1730;border:2px solid #5a5190;padding:8px;margin-bottom:8px;font:inherit;font-size:13px;color:#fff;text-align:left;cursor:pointer}
.row img{width:48px;height:48px}
.row .r{margin-left:auto;font-weight:700;text-align:right}
.row.me{border-color:#ffd23f}
.sub{color:#d6d0f5;font-size:12px}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;height:40px;background:#1b1730;color:#d6d0f5;border:2px solid #5a5190;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:#3d3668;color:#fff;font-weight:700;border-color:#ffd23f}
.nd{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px}
.nd img{width:44px;height:44px;background:#1b1730;border:2px solid #5a5190}
.kids{margin-left:20px;border-left:3px solid #5a5190;padding-left:10px}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#7a4a2a;border:4px solid #1b1730;padding:10px 8px 6px;margin-bottom:12px}
.shelf button{background:#f4ecd8;border:3px solid #1b1730;padding:4px;font:inherit;font-size:10px;color:#2b2545;min-height:118px;cursor:pointer}
.shelf img{width:100%;display:block}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stats div{background:#1b1730;border:2px solid #5a5190;padding:8px;font-size:11px;color:#d6d0f5}
.stats b{display:block;font-size:18px;color:#fff}
#shade{position:absolute;inset:0;background:rgba(15,12,30,.75);display:none;align-items:flex-end;z-index:30000}
#shade.on{display:flex}
#sheet{width:100%;background:#2b2545;border-top:4px solid #5a5190;padding:16px;max-height:92%;overflow-y:auto}
#sheet h3{margin:0;font-size:20px}
.badge{display:inline-block;color:#2b2545;font-size:12px;font-weight:700;padding:2px 8px;margin-top:6px}
.parts{margin:12px 0;font-size:13px;line-height:1.7;color:#d6d0f5}
.parts b{color:#fff}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btns button{min-width:42%}
.pair{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0;font-size:22px;font-weight:700}
.pair img{width:84px;height:84px}
@keyframes shine{from{filter:brightness(1)}to{filter:brightness(1.3) drop-shadow(0 0 5px #fff7b0)}}
.dog.shiny img{animation:shine 1s infinite alternate}
.dog .tag{position:absolute;left:50%;top:-20px;transform:translateX(-50%);white-space:nowrap;background:#fff;color:#2b2545;border:2px solid #1b1730;font-size:10px;font-weight:700;padding:1px 4px}
.decor{position:absolute;touch-action:none;cursor:grab}
.decor img{display:block;pointer-events:none}
.bar2{height:10px;background:#1b1730;border:2px solid #5a5190;margin-top:6px}
.bar2 i{display:block;height:100%;background:#7be06a}
.row button.main,.row button.ghost{flex:none;min-height:40px;min-width:92px;margin-left:auto}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0}
.days div{background:#1b1730;border:2px solid #5a5190;padding:6px 2px;text-align:center;font-size:10px;color:#d6d0f5}
.days div.got{background:#3d3668;color:#fff}
.days div.now{border-color:#ffd23f;color:#ffd23f;font-weight:700}
.seg button{font-size:12px!important;padding:0}
#toast{position:absolute;left:50%;top:120px;transform:translateX(-50%);background:#1b1730;border:2px solid #ffd23f;padding:8px 12px;font-size:13px;font-weight:700;display:none;z-index:40000;max-width:92%;text-align:center}
</style>
</head>

function frame(now){

      else{

        if(L<=sp){d.x=d.tx;d.y=d.ty;

        if(d.trait==='greedy')v*=.5;if(d.trait==='generous')v*=1.5;if(d.zone===1)v*=1.25;if(d.zone===3)v*=1.5;

  }

      else{q.x+=dx/L*sp;q.y+=dy/L*sp;q.face=dx<0?-1:1}}

  q.el.style.transform='translate('+Math.round(q.x)+'px,'+Math.round(q.y)+'px)';q.el.style.zIndex=100+Math.round(q.y);

  if(de){var o=S.decor.filter(function(x){return x.id==de.dataset.id})[0];if(o){var pp=pos(e);ddrag={o:o,el:de,ox:pp.x-o.x,oy:pp.y-o.y};try{yard.setPointerCapture(e.pointerId)}catch(_){}}return}

  drag={d:d,el:el,sx:p.x,sy:p.y,ox:p.x-d.x,oy:p.y-d.y,moved:false,target:null,hx:d.x,hy:d.y};

  if(ddrag){var q=pos(e),bb=bounds();ddrag.o.x=Math.max(0,Math.min(bb.w-30,q.x-ddrag.ox));ddrag.o.y=Math.max(30,Math.min(bb.h-PENH-30,q.y-ddrag.oy));ddrag.el.style.left=ddrag.o.x+'px';ddrag.el.style.top=ddrag.o.y+'px';ddrag.el.style.zIndex=100+Math.round(ddrag.o.y+ddrag.el.offsetHeight-DS);return}

    drag.moved=true;drag.el.classList.add('lift');
    inZone(S.cur).forEach(function(o){if(o!==drag.d&&!o.away)els[o.id].classList.add('cand')});
  }
  if(!drag.moved)return;
  drag.d.x=p.x-drag.ox;drag.d.y=p.y-drag.oy;
  var best=null,bd=48;
  inZone(S.cur).forEach(function(o){if(o===drag.d||o.away)return;var L=Math.hypot(o.x-drag.d.x,o.y-drag.d.y);if(L<bd){bd=L;best=o}});
  if(drag.target&&drag.target!==best)els[drag.target.id].classList.remove('target');
  drag.target=best;if(best)els[best.id].classList.add('target');
});
function endDrag(){

  if(!g.moved){tap(g.d);return}
  if(g.target){askBreed(g.d,g.target,g);return}

    var src=rnd()<.5?a:b;g[k]=src.g[k];from[k]={t:'от '+src.name};
    if(rnd()<m){var nv=pick(k,'mut'),tries=0;while((nv===a.g[k]||nv===b.g[k])&&tries++<20)nv=pick(k,'mut');g[k]=nv;from[k]={t:'мутация!',hot:1}}

  var tr=rnd()<.1?rndTrait():(rnd()<.5?a.trait:b.trait);

  S.dogs=S.dogs.filter(function(d){return d!==a&&d!==b});
  S.dogs.push(kid);mk(kid);S.bred++;
  var gain=discover(g,kid.id);S.stars++;addLeague(5+gain);track('breed',1);if(gain)track('new',1);hud();save();

    all.slice(0,80).map(function(r){return '<button class="row" data-id="'+r.id+'"><img class="px" alt="" src="'+sprite(r.g)+'"><span><b>'+r.name+'</b><br><span class="sub">пок. '+r.gen+' · '+where(r.id)+'</span></span><span class="r" style="color:'+TC[tier(r.g)]+'">'+tname(r.g)+'</span></button>'}).join('');
  }else{
    h='<h2>Домик у озера</h2><p>Здесь отдыхают родители ваших щенков. В игре они больше не участвуют, но остаются с вами, и их можно поставить на витрину. Сейчас их '+S.lake.length+'.</p>'+seg+
    (S.lake.length?S.lake.map(function(id){var d=S.reg[id];if(!d)return '';return '<button class="row" data-card="'+id+'"><img class="px" alt="" src="'+sprite(d.g)+'"><span><b>'+d.name+'</b><br><span class="sub">пок. '+d.gen+' · '+traitOf(d.trait).n+'</span></span><span class="r" style="color:'+TC[tier(d.g)]+'">'+tname(d.g)+'</span></button>'}).join(''):'<p>Пока никого. Скрестите двух собак.</p>');
  }
  var el=$('p-album');el.innerHTML=h;
  [].forEach.call(el.querySelectorAll('.seg button'),function(b){b.onclick=function(){albumMode=b.dataset.m;showAlbum()}});
  [].forEach.call(el.querySelectorAll('[data-id]'),function(b){b.onclick=function(){pedigree(+b.dataset.id)}});
  [].forEach.call(el.querySelectorAll('[data-card]'),function(b){b.onclick=function(){card(+b.dataset.card)}});
  [].forEach.call(el.querySelectorAll('[data-set]'),function(b){b.onclick=function(){
    var x=SETS.filter(function(q){return q.id===b.dataset.set})[0];S.sets[x.id]=true;S.coins+=x.r;
    if(x.d){addDecor(x.d);toast('+'+x.r+' монет и «'+dec(x.d).n+'» уже стоит в мире')}else toast('+'+x.r+' монет');hud();save();showAlbum();
  }});
  [].forEach.call(el.querySelectorAll('[data-k]'),function(b){b.onclick=function(){
    var a=S.album[b.dataset.k],f=S.reg[a.first];
    open('<div style="display:flex;gap:14px;align-items:center"><img class="px" alt="" style="width:96px;height:96px" src="'+sprite(a.g)+'"><div>'+badge(a.g)+'<div class="sub" style="margin-top:6px">стоит '+worth(a.g)+' очков</div></div></div><div class="parts">'+partsHtml(a.g)+'<br>Таких собак у вас было: <b>'+a.n+'</b>'+(f?'<br>Первой была: <b>'+f.name+'</b>, поколение '+f.gen:'')+'</div>'+
    '<div class="btns">'+(f?'<button class="ghost" id="ped">Родословная первой</button><button class="ghost" id="shw">'+(S.show.indexOf(a.first)>=0?'Убрать с витрины':'На витрину')+'</button>':'')+'<button class="main" id="ok">Закрыть</button></div>');
    $('ok').onclick=close;if($('ped'))$('ped').onclick=function(){pedigree(a.first)};
    if($('shw'))$('shw').onclick=function(){var i=S.show.indexOf(a.first);
      if(i>=0)S.show.splice(i,1);else if(S.show.length>=3){toast('На витрине только 3 места');return}else S.show.push(a.first);
      save();close();toast(i>=0?f.name+' убран с витрины':f.name+' теперь на витрине')};
  }});
}
var questMode='daily';
function showQuests(){
  newDay();var e=ev(),ec=part('color',e.c),eg={color:e.c,pattern:'none',ears:'big',acc:'none'};
  var seg='<div class="seg"><button data-m="daily" class="'+(questMode==='daily'?'on':'')+'">На сегодня</button><button data-m="event" class="'+(questMode==='event'?'on':'')+'">Событие</button></div>',h;
  if(questMode==='daily'){
    var all=S.daily.q.every(function(x){return x.done});
    h='<h2>Задания на сегодня</h2><p>За каждое: монеты и одна звезда. Звёзды тратятся в событии.</p>'+seg+
    S.daily.q.map(function(x,i){return '<div class="row" style="cursor:default"><span style="flex:1"><b>'+x.n+'</b><br><span class="sub">'+x.have+' из '+x.need+' · награда: '+x.r+' монет</span><div class="bar2"><i style="width:'+Math.round(x.have/x.need*100)+'%"></i></div></span>'+
      (x.done?'<span class="r" style="color:#7be06a">готово</span>':x.have>=x.need?'<button class="main" data-q="'+i+'">Забрать</button>':'')+'</div>'}).join('')+
    '<div class="row" style="cursor:default;border-color:#ffd23f"><span style="flex:1"><b>Все три задания</b><br><span class="sub">награда: 100 монет и 2 звезды</span></span>'+(S.daily.bonus?'<span class="r" style="color:#7be06a">готово</span>':all?'<button class="main" data-q="b">Забрать</button>':'')+'</div>'+
    '<h2 style="margin-top:16px">Серия входов</h2><p>Награда за каждый день, когда вы заходите. Пропуск ничего не сжигает.</p><div class="days">'+SR.map(function(r,i){return '<div class="'+(i<S.streak.n?'got':'')+(i===S.streak.n-1?' now':'')+'">День '+(i+1)+'<br>'+(r||'щенок')+'</div>'}).join('')+'</div>';
  }else{
    h='<h2>'+e.n+'</h2><p>Событие недели, осталось дней: '+daysLeft()+'. Только сейчас можно получить окрас «'+ec.n+'».</p>'+seg+
    '<div style="text-align:center;background:#1b1730;border:3px solid #ffd23f;padding:10px;margin-bottom:12px"><img class="px" alt="" style="width:144px;height:144px" src="'+sprite(eg)+'"><div style="font-weight:700">'+ec.n+' чихуахуа</div><div class="sub">окрас передаётся щенкам и останется у вас после события</div></div>'+
    '<div class="btns"><button class="main" id="evbuy">Событийный щенок · '+EVCOST+' звёзд (у вас '+S.stars+')</button></div>'+
    '<p style="margin-top:12px">Звёзды дают задания, гости, походы в гости и каждое скрещивание. Ещё есть шанс 3%, что любой щенок, выведенный на этой неделе, сам родится с этим окрасом.</p>';
  }
  var el=$('p-quests');el.innerHTML=h;
  [].forEach.call(el.querySelectorAll('.seg button'),function(b){b.onclick=function(){questMode=b.dataset.m;showQuests()}});
  [].forEach.call(el.querySelectorAll('[data-q]'),function(b){b.onclick=function(){
    if(b.dataset.q==='b'){S.daily.bonus=true;S.coins+=100;S.stars+=2;toast('+100 монет и 2 звезды')}
    else{var x=S.daily.q[+b.dataset.q];x.done=true;S.coins+=x.r;S.stars++;toast('+'+x.r+' монет и звезда')}
    hud();navBadge();save();showQuests();
  }});
  if($('evbuy'))$('evbuy').onclick=function(){
    if(S.stars<EVCOST){toast('Не хватает звёзд: нужно '+EVCOST);return}
    if(inZone(S.cur).length>=maxDogs()){toast('В текущей зоне нет места');return}
    S.stars-=EVCOST;var g={color:e.c,pattern:pick('pattern'),ears:pick('ears'),acc:pick('acc')};if(rollShiny())g.shiny=true;
    var d=newDog(g);S.dogs.push(d);mk(d);var gain=discover(g,d.id);addLeague(gain);if(gain)track('new',1);hud();save();showQuests();toast(d.name+': '+tname(g).toLowerCase()+(gain?' · +'+gain+' очков':''));
  };
}
var shopMode='decor';
function showShop(){
  var el=$('p-shop'),seg='<div class="seg"><button data-m="decor" class="'+(shopMode==='decor'?'on':'')+'">Украшения</button><button data-m="up" class="'+(shopMode==='up'?'on':'')+'">Улучшения</button></div>',h;
  if(shopMode==='decor'){
    h='<h2>Лавка</h2><p>У вас <b style="color:#ffd23f">'+S.coins+' монет</b>. Украшения ставятся в текущую зону («'+ZN[S.cur]+'»), их можно перетаскивать. Каждое добавляет уют: с ним гости приходят чаще и дарят больше. Сейчас уют: '+cozy()+'.</p>'+seg+
    DEC.map(function(x){var n=S.decor.filter(function(o){return o.type===x.id}).length;
      return '<div class="row" style="cursor:default"><img class="px" alt="" src="'+x.img+'" style="object-fit:contain"><span><b>'+x.n+'</b><br><span class="sub">уют +'+x.z+(n?' · у вас '+n:'')+'</span></span>'+
      (x.set?'<span class="r sub">награда<br>за набор</span>':'<button class="main" data-d="'+x.id+'">'+x.c+'</button>')+'</div>'}).join('');
  }else{
    h='<h2>Лавка</h2><p>У вас <b style="color:#ffd23f">'+S.coins+' монет</b>. Улучшения покупаются один раз и действуют всегда.</p>'+seg+
    UP.map(function(x){var l=lvl(x.id),mx=x.c.length;
      return '<div class="row" style="cursor:default"><span style="flex:1"><b>'+x.n+'</b><br><span class="sub">'+x.h+(mx>1?' · уровень '+l+' из '+mx:'')+'</span></span>'+
      (l>=mx?'<span class="r" style="color:#7be06a">куплено</span>':'<button class="main" data-u="'+x.id+'">'+x.c[l]+'</button>')+'</div>'}).join('');
  }
  el.innerHTML=h;
  [].forEach.call(el.querySelectorAll('.seg button'),function(b){b.onclick=function(){shopMode=b.dataset.m;showShop()}});
  [].forEach.call(el.querySelectorAll('[data-d]'),function(b){b.onclick=function(){
    var x=dec(b.dataset.d);if(S.coins<x.c){toast('Не хватает монет: нужно '+x.c);return}
    S.coins-=x.c;addDecor(x.id);hud();save();showShop();toast('«'+x.n+'» стоит в зоне «'+ZN[S.cur]+'»');
  }});
  [].forEach.call(el.querySelectorAll('[data-u]'),function(b){b.onclick=function(){
    var x=UP.filter(function(q){return q.id===b.dataset.u})[0],c=x.c[lvl(x.id)];if(S.coins<c){toast('Не хватает монет: нужно '+c);return}
    S.coins-=c;S.up[x.id]=lvl(x.id)+1;hud();save();showShop();toast('Куплено: '+x.n);
  }});
}
function bots(week,tier,prog){
  return LBOT.map(function(n,i){var f=Math.sin(week*12.9898+i*78.233)*43758.5453;f=f-Math.floor(f);return {n:n,s:Math.round((60+f*340)*(1+tier*.8)*prog)}});
}
function leagueTable(week,tier,prog,pts){var L=bots(week,tier,prog);L.push({n:S.pname+' (вы)',s:pts,me:1});L.sort(function(a,b){return b.s-a.s});return L}
var friendMode='friends';
function showFriends(){
  var seg='<div class="seg"><button data-m="friends" class="'+(friendMode==='friends'?'on':'')+'">Друзья</button><button data-m="league" class="'+(friendMode==='league'?'on':'')+'">Лига</button></div>',h;
  if(friendMode==='friends'){
    h='<h2>Друзья</h2><p>Это макет: друзья ненастоящие. Их собаки сами заходят к вам в гости во двор, а вы можете отправить свою к ним.</p>'+seg+
    FR.map(function(f,i){return '<button class="row" data-f="'+i+'"><img class="px" alt="" src="'+sprite(f.dogs[0])+'"><span><b>'+f.n+'</b><br><span class="sub">очки коллекции: '+f.s+'</span></span><span class="r">открыть</span></button>'}).join('');
  }else{
    var d=new Date(),prog=.12+.88*(((DAY()+3)%7)+d.getHours()/24)/7,L=leagueTable(S.league.week,S.league.tier,prog,S.league.pts);
    h='<h2>'+LG[S.league.tier]+' лига</h2><p>Макет: соперники ненастоящие, но их очки растут всю неделю. Считаются очки, набранные за эту неделю: новые виды и каждое скрещивание. До конца недели дней: '+daysLeft()+'. Первые трое поднимаются выше'+(S.league.tier?', последние трое опускаются':'')+'.</p>'+seg+
    L.map(function(x,i){return '<div class="row'+(x.me?' me':'')+'" style="cursor:default"><b>'+(i+1)+'</b><span>'+x.n+'</span><span class="r">'+x.s+(i<3?'<br><span style="color:#7be06a;font-size:10px">повышение</span>':(S.league.tier&&i>=7?'<br><span style="color:#ff8a8a;font-size:10px">вылет</span>':''))+'</span></div>'}).join('');
  }
  var el=$('p-friends');el.innerHTML=h;
  [].forEach.call(el.querySelectorAll('.seg button'),function(b){b.onclick=function(){friendMode=b.dataset.m;showFriends()}});
  [].forEach.call(el.querySelectorAll('[data-f]'),function(b){b.onclick=function(){friend(FR[+b.dataset.f])}});
}
function friend(f){
  open('<h3>'+f.n+'</h3><div class="sub" style="margin:4px 0 10px">очки коллекции: '+f.s+'</div><div class="shelf">'+f.dogs.map(function(g){return '<button style="cursor:default"><img class="px" alt="" src="'+sprite(g)+'">'+tname(g)+'</button>'}).join('')+'</div>'+
  '<div class="btns"><button class="ghost" id="send">Отправить собаку в гости</button><button class="main" id="ok">Закрыть</button></div>');
  $('ok').onclick=close;
  $('send').onclick=function(){
    var av=S.dogs.filter(function(d){return !d.away});
    open('<h3>Кто пойдёт к '+f.n+'?</h3><div class="sub" style="margin:4px 0 10px">Собака вернётся через 2 минуты (в настоящей игре через пару часов) с монетами и звездой.</div>'+
    av.map(function(d){return '<button class="row" data-id="'+d.id+'"><img class="px" alt="" src="'+sprite(d.g)+'"><span><b>'+d.name+'</b><br><span class="sub">'+where(d.id)+'</span></span></button>'}).join('')+'<div class="btns"><button class="main" id="ok">Отмена</button></div>');
    $('ok').onclick=close;
    [].forEach.call($('sheet').querySelectorAll('[data-id]'),function(bn){bn.onclick=function(){
      var d=byId(+bn.dataset.id);d.away=Date.now()+120000;d.host=f.n;d.coin=0;d.pen=false;track('visit',1);hud();save();close();toast(d.name+' ушёл в гости к '+f.n);
    }});
  };
}
function showProfile(){
  var slots='';for(var i=0;i<3;i++){var r=S.reg[S.show[i]];slots+=r?'<button data-id="'+r.id+'"><img class="px" alt="" src="'+sprite(r.g)+'"><b>'+r.name+'</b><br>'+tname(r.g)+'</button>':'<button data-id="0" style="color:#8a7a5a">пусто</button>'}
  var el=$('p-profile');
  el.innerHTML='<h2>'+S.pname+'</h2><p>Так ваш профиль увидят другие игроки. '+LG[S.league.tier]+' лига.</p><div class="shelf">'+slots+'</div>'+
  '<p>Витрина: до трёх собак. Откройте карточку любой собаки, в мире или у озера, и нажмите «На витрину».</p>'+
  '<div class="stats"><div><b>'+score()+'</b>очков коллекции</div><div><b>'+Object.keys(S.album).length+'</b>видов открыто</div><div><b>'+S.bred+'</b>щенков выведено</div><div><b>'+maxGen()+'</b>старшее поколение</div><div><b>'+cozy()+'</b>уют</div><div><b>'+S.streak.n+' из 7</b>серия входов</div></div>'+
  '<div class="btns"><button class="ghost" id="ren">Сменить имя</button><button class="ghost" id="reset">Начать заново</button></div>';
  [].forEach.call(el.querySelectorAll('.shelf button'),function(b){b.onclick=function(){if(+b.dataset.id)card(+b.dataset.id);else toast('Выберите собаку и нажмите «На витрину»')}});
  $('ren').onclick=function(){var n=prompt('Имя игрока',S.pname);if(n&&n.trim()){S.pname=n.trim().slice(0,16);save();showProfile()}};
  $('reset').onclick=function(){if(confirm('Сбросить весь прогресс?')){S=null;try{localStorage.removeItem(KEY);localStorage.removeItem(KEY1)}catch(e){}location.reload()}};
}
function tab(t){
  if(t==='lake'){albumMode='lake';t='album'}
  [].forEach.call(document.querySelectorAll('nav button'),function(b){b.classList.toggle('on',b.dataset.tab===t)});
  var hh=document.querySelector('header').offsetHeight;
  ['album','quests','shop','friends','profile'].forEach(function(p){$('p-'+p).style.top=hh+'px';$('p-'+p).classList.toggle('on',p===t)});
  if(t==='album')showAlbum();if(t==='quests')showQuests();if(t==='shop')showShop();if(t==='friends')showFriends();if(t==='profile')showProfile();
  if(t==='yard')scene();
}
[].forEach.call(document.querySelectorAll('nav button'),function(b){b.onclick=function(){tab(b.dataset.tab)}});

/* ---------- start of session: offline income, league, streak ---------- */
(function(){
  var now=Date.now();
  if(S.t){
    var capH=[4,8,12][lvl('cap')],el=Math.min(now-S.t,capH*3600e3)/1000;
    if(el>60){var r=0;S.dogs.forEach(function(d){r+=rate(d)});var gain=Math.round(r*el*.1);
      if(gain>0)queue.push(function(){var m=Math.floor(el/60);open('<h3>Пока вас не было</h3><div class="parts">Прошло: <b>'+(m>=60?Math.floor(m/60)+' ч '+(m%60)+' мин':m+' мин')+'</b><br>Собаки принесли: <b>'+gain+' монет</b></div><div class="sub">Без вас собаки работают в 10 раз медленнее и копят не дольше '+capH+' ч.</div><div class="btns"><button class="main" id="ok">Забрать</button></div>');
        $('ok').onclick=function(){S.coins+=gain;hud();save();close()}})}
  }
  S.dogs.forEach(function(d){if(d.away&&d.away<now)d.away=1});
  var w=WEEK();
  if(S.league.week&&S.league.week!==w){
    var L=leagueTable(S.league.week,S.league.tier,1,S.league.pts),place=1;L.forEach(function(x,i){if(x.me)place=i+1});
    var rew=[300,200,120][place-1]||40,old=S.league.tier,nt=old;if(place<=3)nt=Math.min(3,old+1);else if(place>=8)nt=Math.max(0,old-1);
    S.league={week:w,tier:nt,pts:0};
    queue.push(function(){open('<h3>Неделя в лиге закончилась</h3><div class="parts">Ваше место: <b>'+place+' из 10</b><br>Награда: <b>'+rew+' монет</b><br>'+(nt>old?'Вы поднялись: <b>'+LG[nt]+' лига</b>':nt<old?'Вы опустились: <b>'+LG[nt]+' лига</b>':'Вы остаётесь: <b>'+LG[nt]+' лига</b>')+'</div><div class="btns"><button class="main" id="ok">Забрать</button></div>');
      $('ok').onclick=function(){S.coins+=rew;hud();save();close()}});
  }else if(!S.league.week)S.league.week=w;
  newDay();
  var today=DAY();
  if(S.streak.last!==today){
    S.streak.n=S.streak.n%7+1;S.streak.last=today;var n=S.streak.n,r=SR[n-1];
    queue.push(function(){open('<h3>Серия входов: день '+n+'</h3><div class="days">'+SR.map(function(x,i){return '<div class="'+(i<n?'got':'')+(i===n-1?' now':'')+'">День '+(i+1)+'<br>'+(x||'щенок')+'</div>'}).join('')+'</div><div class="parts">Сегодня: <b>'+(r?r+' монет':'редкий щенок')+'</b></div><div class="btns"><button class="main" id="ok">Забрать</button></div>');
      $('ok').onclick=function(){
        if(r)S.coins+=r;else{var z=freeZone();if(z<0){S.coins+=500;toast('Нет места для щенка, вместо него 500 монет')}else{
          var g,i=0;do{g={color:pick('color','mut'),pattern:pick('pattern','mut'),ears:pick('ears','mut'),acc:pick('acc','mut')};i++}while(tier(g)<2&&i<60);
          var cur=S.cur;S.cur=z;var d=newDog(g);S.cur=cur;S.dogs.push(d);mk(d);addLeague(discover(g,d.id));toast(d.name+': '+tname(g).toLowerCase()+', зона «'+ZN[z]+'»')}}
        hud();save();close()}});
  }
  hud();navBadge();save();
  if(queue.length)queue.shift()();
})();
window.addEventListener('pagehide',function(){if(S)save()});
window.__woc={S:function(){return S},sprite:sprite,P:P,hud:hud,save:save,guest:function(){guestNext=0}};
})();
</script>
